# One 63K image from $0400: the RAM disk, the p8fs workspace, then the
# p8fs code and the demo as ROM, with the reset vector pointing at test_start.
# Run it with: c65 -r demo.bin -a 0x400
MEMORY {
    ZP:     file = "",               start = $0000, size = $100;
    RAM:    file = %O, fill = yes,   start = $0400, size = $b400;
    P8RAM:  file = %O, fill = yes,   start = $b800, size = $800;
    ROM:    file = %O, fill = yes,   start = $c000, size = $4000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp, optional = yes;
    RAMDISK:  load = RAM,   type = rw;
    P8RAM:    load = P8RAM, type = rw, align = $800;
    CODE:     load = ROM,   type = ro;
    DATA:     load = ROM,   type = ro;
    VECTORS:  load = ROM,   type = ro, start = $fffa;
}
